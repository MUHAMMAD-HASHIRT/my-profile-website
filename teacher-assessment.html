<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Assessment - Teacher Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="data-storage.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --primary-light: #fbbf24;
            --secondary: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #1e293b;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: var(--dark);
            padding: 20px 30px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray);
            padding: 10px 20px;
            background: var(--bg);
            border-radius: 12px;
        }

        /* Container */
        .container {
            display: flex;
            margin-top: 80px;
            height: calc(100vh - 80px);
        }

        /* Student Sidebar */
        .student-sidebar {
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-right: 2px solid var(--gray-light);
            overflow-y: auto;
            padding: 30px;
            box-shadow: var(--shadow-lg);
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 3px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .class-section {
            margin-bottom: 32px;
        }

        .class-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            font-weight: 700;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .student-list {
            list-style: none;
        }

        .student-item {
            padding: 16px 18px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            background: var(--bg);
            font-weight: 500;
            position: relative;
        }

        .student-item:hover {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .student-item.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-weight: 700;
            border-color: var(--primary-dark);
            box-shadow: var(--shadow-lg);
        }

        .student-item.completed::after {
            content: '✓';
            position: absolute;
            right: 18px;
            color: var(--success);
            font-weight: 700;
            font-size: 18px;
        }

        .student-item.active.completed::after {
            color: white;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
        }

        .locked-message {
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border: 3px solid var(--primary);
            padding: 60px 40px;
            border-radius: 24px;
            text-align: center;
            margin: 100px auto;
            max-width: 600px;
            box-shadow: var(--shadow-lg);
        }

        .locked-message h2 {
            color: var(--dark);
            margin-bottom: 16px;
            font-size: 28px;
            font-weight: 700;
        }

        .locked-message p {
            color: var(--gray);
            font-size: 16px;
        }

        .assessment-form {
            max-width: 1000px;
            margin: 0 auto;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 3px solid var(--gray-light);
        }

        .student-name-display {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .subject-display {
            font-size: 18px;
            color: var(--gray);
            font-weight: 500;
        }

        /* Assessment Tables */
        .assessment-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 32px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .assessment-table thead th {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-weight: 700;
            padding: 16px 12px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .assessment-table thead th:first-child {
            width: 60%;
        }

        .assessment-table thead th:not(:first-child) {
            width: 10%;
            text-align: center;
        }

        .assessment-table tbody td {
            padding: 14px 12px;
            border: 1px solid var(--gray-light);
            font-size: 13px;
            vertical-align: middle;
            background: white;
        }

        .assessment-table tbody td:first-child {
            text-align: left;
            font-weight: 500;
        }

        .assessment-table tbody td:not(:first-child) {
            text-align: center;
        }

        .category-row {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(99, 102, 241, 0.05));
            font-weight: 700;
            color: var(--primary);
        }

        .skill-row {
            padding-left: 24px;
        }

        .checkbox-cell {
            cursor: pointer;
            transition: background 0.3s;
        }

        .checkbox-cell:hover {
            background: rgba(245, 158, 11, 0.05);
        }

        .checkbox-cell input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        /* Quantitative Section */
        .quantitative-section {
            margin-top: 40px;
            background: var(--bg);
            padding: 32px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .quantitative-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 24px;
        }

        .quantitative-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .quantitative-table thead th {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-weight: 700;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .quantitative-table tbody td {
            padding: 16px 12px;
            border: 1px solid var(--gray-light);
            text-align: center;
            font-size: 14px;
            background: white;
        }

        .quantitative-table input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--gray-light);
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .quantitative-table input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }

        /* Teacher Remarks */
        .teacher-remarks {
            margin-top: 40px;
            background: var(--bg);
            padding: 32px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .teacher-remarks-label {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .teacher-remarks-box {
            border: 2px solid var(--gray-light);
            min-height: 180px;
            padding: 20px;
            width: 100%;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .teacher-remarks-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }

        /* Submit Section */
        .submit-section {
            margin-top: 40px;
            text-align: center;
            padding: 32px;
            background: linear-gradient(135deg, var(--bg), rgba(245, 158, 11, 0.05));
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 18px 48px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .submit-btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .submit-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgba(245, 158, 11, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-2px);
        }

        .submit-btn span {
            position: relative;
            z-index: 1;
        }

        .remove-content-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 2px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            margin-left: 12px;
            transition: all 0.3s;
        }

        .remove-content-btn:hover {
            background: var(--danger);
            color: white;
            transform: scale(1.1);
        }

        @media (max-width: 968px) {
            .container {
                flex-direction: column;
            }

            .student-sidebar {
                width: 100%;
                height: auto;
                max-height: 300px;
            }

            .main-content {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="teacher-dashboard.html" class="back-btn">← Back</a>
            <div class="header-title">Student Assessment Portal</div>
        </div>
        <div class="header-right" id="teacherInfo">Loading...</div>
    </div>

    <div class="container">
        <div class="student-sidebar" id="studentSidebar">
            <div class="sidebar-title">
                <span>👥</span>
                <span>Students by Class</span>
            </div>
            <div id="studentListContainer">Loading students...</div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="locked-message" id="lockedMessage" style="display: none;">
                <h2>⚠️ Portal Currently Locked</h2>
                <p>The admin is currently updating course content. Please check back later.</p>
            </div>

            <div class="assessment-form" id="assessmentForm" style="display: none;">
                <div class="form-header">
                    <div class="student-name-display" id="studentNameDisplay">Select a student</div>
                    <div class="subject-display" id="subjectDisplay"></div>
                </div>
                <div id="assessmentContent"></div>
                <div class="submit-section">
                    <button class="submit-btn" id="submitBtn" onclick="saveAssessment()">
                        <span>💾 Save Assessment</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTeacher = null;
        let currentStudent = null;
        let courseContents = [];
        let assessmentData = {};

        function checkPortalLock() {
            if (schoolData.isCourseContentLocked()) {
                document.getElementById('lockedMessage').style.display = 'block';
                document.getElementById('assessmentForm').style.display = 'none';
                return true;
            }
            document.getElementById('lockedMessage').style.display = 'none';
            document.getElementById('assessmentForm').style.display = 'block';
            return false;
        }

        function init() {
            // STRICT login check
            const isLoggedIn = sessionStorage.getItem('teacherLoggedIn');
            const userRole = sessionStorage.getItem('userRole');
            
            if (!isLoggedIn || userRole !== 'teacher') {
                sessionStorage.clear();
                window.location.href = 'teacher-login.html';
                return;
            }

            const portalId = sessionStorage.getItem('userPortalId');
            currentTeacher = schoolData.getTeacherByPortalId(portalId);
            
            if (!currentTeacher) {
                alert('Teacher not found. Please contact admin.');
                window.location.href = 'teacher-login.html';
                return;
            }

            if (!currentTeacher.classes || currentTeacher.classes.length === 0) {
                document.getElementById('studentListContainer').innerHTML = 
                    '<div style="padding: 40px; text-align: center; color: var(--gray); background: var(--bg); border-radius: 12px;">No classes assigned yet. Please contact admin.</div>';
                return;
            }

            document.getElementById('teacherInfo').textContent = 
                `${currentTeacher.name} - ${currentTeacher.subject}`;

            if (checkPortalLock()) {
                return;
            }

            courseContents = schoolData.getCourseContent(currentTeacher.subject);
            if (courseContents.length === 0) {
                document.getElementById('assessmentContent').innerHTML = 
                    '<div style="text-align: center; padding: 60px; color: var(--gray); background: var(--bg); border-radius: 20px;">No course content available. Please contact admin.</div>';
                return;
            }

            loadStudents();
        }

        function loadStudents() {
            const students = schoolData.getStudentsForTeacher(currentTeacher.id);
            
            if (students.length === 0) {
                document.getElementById('studentListContainer').innerHTML = 
                    '<div style="padding: 40px; text-align: center; color: var(--gray); background: var(--bg); border-radius: 12px;">No students found.</div>';
                return;
            }

            const grouped = {};
            students.forEach(student => {
                const key = `Class ${student.class} - Section ${student.section}`;
                if (!grouped[key]) {
                    grouped[key] = [];
                }
                grouped[key].push(student);
            });

            let html = '';
            Object.keys(grouped).sort().forEach(classKey => {
                html += `<div class="class-section">
                    <div class="class-header">${classKey}</div>
                    <ul class="student-list">`;
                
                grouped[classKey].forEach(student => {
                    const assessment = schoolData.getAssessment(currentTeacher.id, student.id);
                    const completed = assessment && assessment.submitted;
                    html += `<li class="student-item ${completed ? 'completed' : ''} ${currentStudent && currentStudent.id === student.id ? 'active' : ''}"
                             onclick="selectStudent('${student.id}', event)">
                        ${student.name}
                    </li>`;
                });
                
                html += `</ul></div>`;
            });

            document.getElementById('studentListContainer').innerHTML = html;
        }

        function selectStudent(studentId, event) {
            const students = schoolData.getStudentsForTeacher(currentTeacher.id);
            currentStudent = students.find(s => s.id === studentId);
            
            if (!currentStudent) return;

            document.querySelectorAll('.student-item').forEach(item => {
                item.classList.remove('active');
            });
            if (event && event.target) {
                event.target.classList.add('active');
            }

            const existing = schoolData.getAssessment(currentTeacher.id, studentId);
            assessmentData = existing ? { ...existing } : {};

            document.getElementById('studentNameDisplay').textContent = currentStudent.name;
            document.getElementById('subjectDisplay').textContent = 
                `${currentTeacher.subject} - Class ${currentStudent.class}${currentStudent.section}`;

            renderAssessmentForm();
        }

        function renderAssessmentForm() {
            let html = '';

            courseContents.forEach(content => {
                html += `<table class="assessment-table">
                    <thead>
                        <tr>
                            <th>${content.title} <button class="remove-content-btn" onclick="removeContent('${content.id}')" title="Remove this section">×</button></th>
                            <th>ELE</th>
                            <th>MLE</th>
                            <th>P</th>
                            <th>N</th>
                        </tr>
                    </thead>
                    <tbody>`;

                content.skills.forEach((skill, index) => {
                    const key = `${content.id}_${index}`;
                    const checked = assessmentData[key] || {};
                    
                    html += `<tr class="skill-row">
                        <td>${skill}</td>
                        <td class="checkbox-cell">
                            <input type="checkbox" ${checked.ELE ? 'checked' : ''} 
                                   onchange="updateCheckbox('${key}', 'ELE', this.checked)">
                        </td>
                        <td class="checkbox-cell">
                            <input type="checkbox" ${checked.MLE ? 'checked' : ''} 
                                   onchange="updateCheckbox('${key}', 'MLE', this.checked)">
                        </td>
                        <td class="checkbox-cell">
                            <input type="checkbox" ${checked.P ? 'checked' : ''} 
                                   onchange="updateCheckbox('${key}', 'P', this.checked)">
                        </td>
                        <td class="checkbox-cell">
                            <input type="checkbox" ${checked.N ? 'checked' : ''} 
                                   onchange="updateCheckbox('${key}', 'N', this.checked)">
                        </td>
                    </tr>`;
                });

                html += `</tbody></table>`;
            });

            const quant = assessmentData.quantitative || {};
            html += `<div class="quantitative-section">
                <div class="quantitative-title">📊 Quantitative Assessment</div>
                <table class="quantitative-table">
                    <thead>
                        <tr>
                            <th>Quantitative</th>
                            <th>1st Assessment</th>
                            <th>2nd Assessment</th>
                            <th>Mid of Year</th>
                            <th>Total</th>
                            <th>Percentage</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="font-weight: 600;">Scores</td>
                            <td><input type="text" value="${quant.first || ''}" placeholder="/25" 
                                       onchange="updateQuantitative('first', this.value)"></td>
                            <td><input type="text" value="${quant.second || ''}" placeholder="/25" 
                                       onchange="updateQuantitative('second', this.value)"></td>
                            <td><input type="text" value="${quant.mid || ''}" placeholder="/100" 
                                       onchange="updateQuantitative('mid', this.value)"></td>
                            <td><input type="text" value="${quant.total || ''}" placeholder="/150" 
                                       onchange="updateQuantitative('total', this.value)"></td>
                            <td><input type="text" value="${quant.percentage || ''}" placeholder="%" 
                                       onchange="updateQuantitative('percentage', this.value)"></td>
                        </tr>
                    </tbody>
                </table>
            </div>`;

            html += `<div class="teacher-remarks">
                <div class="teacher-remarks-label">📝 Teacher Remarks & Notes</div>
                <textarea class="teacher-remarks-box" id="teacherRemarks" 
                          onchange="updateRemarks(this.value)" placeholder="Enter your remarks and notes about this student...">${assessmentData.remarks || ''}</textarea>
            </div>`;

            document.getElementById('assessmentContent').innerHTML = html;
        }

        function updateCheckbox(key, type, checked) {
            if (!assessmentData[key]) assessmentData[key] = {};
            assessmentData[key][type] = checked;
        }

        function updateQuantitative(type, value) {
            if (!assessmentData.quantitative) assessmentData.quantitative = {};
            assessmentData.quantitative[type] = value;
        }

        function updateRemarks(value) {
            assessmentData.remarks = value;
        }

        function removeContent(contentId) {
            if (!confirm('Are you sure you want to remove this content section? This will not affect saved scores.')) {
                return;
            }
            schoolData.removeCourseContent(currentTeacher.subject, contentId);
            courseContents = schoolData.getCourseContent(currentTeacher.subject);
            renderAssessmentForm();
        }

        function saveAssessment() {
            if (!currentStudent) {
                alert('Please select a student first.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = '<span>💾 Saving...</span>';
            submitBtn.disabled = true;

            schoolData.saveAssessment(currentTeacher.id, currentStudent.id, assessmentData);
            
            setTimeout(() => {
                loadStudents();
                submitBtn.innerHTML = '<span>✅ Saved Successfully!</span>';
                setTimeout(() => {
                    submitBtn.innerHTML = '<span>💾 Save Assessment</span>';
                    submitBtn.disabled = false;
                }, 2000);
            }, 500);
        }

        init();
    </script>
</body>
</html>
